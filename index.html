<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>送给 Sophia ❄️</title>
<style>
  :root{
    --ink:#f2f5ff; --ink-soft:#c3cbe8; --glow:#bfe3ff; --pink:#ffc2dc;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:linear-gradient(180deg, #070b22 0%, #0f1840 38%, #2b2f66 62%, #4a3f78 78%, #1a2a4a 100%);
    color:var(--ink);
    font-family:'Kaiti SC','STKaiti','KaiTi','Noto Serif CJK SC','Songti SC','PingFang SC',serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #gl{ position:fixed; inset:0; width:100%; height:100%; z-index:1; display:block; touch-action:none; }
  .shimmer{ animation:shim 4s ease-in-out infinite; }
  .shimmer.b{ animation-delay:1.3s; } .shimmer.c{ animation-delay:2.6s; }
  @keyframes shim{ 0%,100%{ opacity:0.08; } 50%{ opacity:0.45; } }

  /* encabezado */
  .top{
    position:fixed; top:max(18px, env(safe-area-inset-top)); left:0; right:0; z-index:3;
    text-align:center; pointer-events:none;
    opacity:0; transition:opacity 1.4s ease 0.6s;
  }
  .top.show{ opacity:1; }
  .top h1{ text-shadow:0 0 18px rgba(191,227,255,0.55), 0 2px 12px rgba(0,0,0,0.6); font-weight:400; font-size:clamp(1.5rem,6.5vw,2.1rem); letter-spacing:0.25em; padding-left:0.25em; text-shadow:0 0 18px rgba(191,227,255,0.55); }
  .top .days{ text-shadow:0 1px 10px rgba(0,0,0,0.8); margin-top:0.5rem; font-size:0.9rem; letter-spacing:0.12em; color:var(--ink-soft); }
  .top .days b{ color:var(--pink); font-weight:600; }
  .hint{
    position:fixed; left:0; right:0; bottom:max(18px, env(safe-area-inset-bottom)); z-index:3;
    text-align:center; font-size:0.9rem; letter-spacing:0.15em; color:var(--ink);
    text-shadow:0 1px 8px rgba(0,0,0,0.6);
    opacity:0; transition:opacity 1s ease; pointer-events:none;
  }
  .hint.show{ opacity:0.85; animation:breathe 2.8s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:0.4; } 50%{ opacity:0.95; } }
  .count{
    position:fixed; z-index:3; top:max(14px, env(safe-area-inset-top)); right:14px;
    font-size:0.8rem; color:var(--ink-soft); background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15); padding:0.3em 0.8em; border-radius:999px;
    opacity:0; transition:opacity 1s ease;
  }
  .count.show{ opacity:1; }

  /* intro */
  #intro{
    position:fixed; inset:0; z-index:6; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:0 24px;
    background:radial-gradient(ellipse 80% 60% at 50% 45%, rgba(10,16,46,0.55), rgba(5,8,25,0.92));
    transition:opacity 1.6s ease;
  }
  #intro.gone{ opacity:0; pointer-events:none; }
  #intro .to{ font-family:Georgia,'Times New Roman',serif; font-size:clamp(2rem,10vw,3rem); letter-spacing:0.35em; padding-left:0.35em; text-shadow:0 0 26px rgba(191,227,255,0.6); }
  #intro .sub{ margin-top:1rem; font-size:clamp(1.1rem,5vw,1.4rem); letter-spacing:0.2em; color:var(--pink); }
  #intro .place{ margin-top:0.6rem; font-size:0.9rem; letter-spacing:0.25em; color:var(--ink-soft); }
  #intro .tap{ margin-top:2.6rem; font-size:0.9rem; letter-spacing:0.25em; color:var(--ink-soft); animation:breathe 2.6s ease-in-out infinite; }

  /* tarjeta con el mensaje */
  #veil{ position:fixed; inset:0; z-index:7; background:rgba(5,8,25,0.45); opacity:0; pointer-events:none; transition:opacity 0.5s ease; }
  #veil.on{ opacity:1; pointer-events:auto; }
  #card{
    position:fixed; z-index:8; left:50%; top:50%;
    width:min(86vw, 380px);
    transform:translate(-50%,-46%) scale(0.85); opacity:0; pointer-events:none;
    transition:transform 0.6s cubic-bezier(.2,1.2,.4,1), opacity 0.45s ease;
    background:linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
    border:1px solid rgba(255,255,255,0.25);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-radius:22px; padding:2rem 1.6rem 1.5rem; text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,0.45), 0 0 40px rgba(191,227,255,0.15);
  }
  #card.on{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
  #card .n{ font-size:0.8rem; letter-spacing:0.25em; color:var(--ink-soft); }
  #card .msg{ margin:1rem 0 1.4rem; font-size:clamp(1.2rem,5.4vw,1.45rem); line-height:1.8; color:#fff; text-shadow:0 0 14px rgba(191,227,255,0.35); }
  #card button{
    background:rgba(255,255,255,0.14); color:#fff; border:1px solid rgba(255,255,255,0.35);
    border-radius:999px; padding:0.55em 1.8em; font-family:inherit; font-size:1rem; cursor:pointer;
  }
  #card.final .msg{ font-size:clamp(1.25rem,5.6vw,1.5rem); }
  #card.final .big{ display:block; font-size:2.2em; color:var(--pink); margin-top:0.4rem; letter-spacing:0.2em; padding-left:0.2em; }

  @media (prefers-reduced-motion: reduce){
    .shimmer, .hint.show, #intro .tap{ animation:none; }
  }

  #intro{ cursor:default; } #intro.ready{ cursor:pointer; }
  .hint{ bottom:max(16px, env(safe-area-inset-bottom)); padding:0 16px; }
  .tools{ position:fixed; z-index:4; left:0; right:0; bottom:calc(max(16px, env(safe-area-inset-bottom)) + 34px);
    display:flex; justify-content:center; gap:10px; opacity:0; pointer-events:none; transition:opacity 1s ease; }
  .tools.show{ opacity:1; pointer-events:auto; }
  .tools button{ font-family:inherit; font-size:0.9rem; color:#fff; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25);
    border-radius:999px; padding:0.45em 1.1em; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer; }
  .tools button.on{ background:rgba(255,194,220,0.35); border-color:rgba(255,194,220,0.8); }
  #wishBox{ position:fixed; z-index:8; left:50%; top:40%; width:min(86vw,360px); transform:translate(-50%,-46%) scale(0.9); opacity:0; pointer-events:none;
    transition:transform 0.5s cubic-bezier(.2,1.2,.4,1), opacity 0.35s ease; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.07)); border:1px solid rgba(255,255,255,0.25);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-radius:22px; padding:1.6rem 1.3rem 1.3rem; }
  #wishBox.on{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
  #wishBox .t{ font-size:1.1rem; letter-spacing:0.1em; margin-bottom:1rem; }
  #wishBox input{ width:100%; font-family:inherit; font-size:16px; padding:0.7em 1em; border-radius:14px; border:1px solid rgba(255,255,255,0.3);
    background:rgba(0,0,0,0.25); color:#fff; outline:none; }
  #wishBox .row{ display:flex; gap:10px; justify-content:center; margin-top:1rem; }
  #wishBox button{ font-family:inherit; font-size:0.95rem; color:#fff; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); border-radius:999px; padding:0.5em 1.2em; cursor:pointer; }
  #wishBox button.main{ background:rgba(255,170,90,0.35); border-color:rgba(255,190,120,0.8); }
  #card .msg{ font-size:clamp(1.1rem,5vw,1.4rem); }
  #nogl{ position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:1.1rem; line-height:1.9; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="top" id="top">
  <h1>两个月快乐</h1>
  <div class="days" id="days"></div>
</div>
<div class="count" id="count">0 / 12</div>
<div class="hint" id="hint">滑动看看雪山 · 轻触蝴蝶</div>

<div id="intro" role="button" aria-label="开始">
  <div class="to">SOPHIA</div>
  <div class="sub">两个月快乐</div>
  <div class="place">天山 · 天池</div>
  <div class="tap" id="introTap">正在准备雪山……</div>
</div>

<div id="veil"></div>
<div id="card" role="dialog" aria-live="polite">
  <div class="n" id="cardN"></div>
  <div class="msg" id="cardMsg"></div>
  <button id="cardBtn">收下啦 💙</button>
</div>
<div class="tools" id="tools">
  <button id="bMusic" hidden>🎵</button>
</div>
<audio id="bgm" loop preload="auto"></audio>
<div id="nogl">你的浏览器打不开 3D 画面 😢<br>换个浏览器试试吧</div>
